<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 타이머</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 폰트 및 커스텀 스타일 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            -webkit-tap-highlight-color: transparent;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* 숫자 입력 화살표 숨기기 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* 부드러운 전환 효과 */
        .transition-transform {
            transition-property: transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }

        /* 타이머 링 애니메이션 부드럽게 */
        #progress-ring {
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        .pulse-animation {
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.9));
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500/30">

    <!-- 메인 카드 컨테이너 -->
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700 shadow-2xl rounded-3xl p-8 sm:p-12 w-full max-w-md relative overflow-hidden">
        
        <!-- === [1] 설정 화면 === -->
        <div id="setup-view" class="flex flex-col items-center justify-center space-y-10 animate-fade-in">
            <h1 class="text-2xl font-medium text-slate-300 tracking-wide">타이머 설정</h1>
            
            <!-- 시간 입력부 -->
            <div class="flex items-center space-x-2 sm:space-x-4 text-4xl sm:text-5xl font-mono font-light">
                <div class="flex flex-col items-center">
                    <input id="input-h" type="number" min="0" max="99" value="00" 
                           class="w-16 sm:w-20 bg-transparent text-center border-b-2 border-slate-600 focus:border-emerald-400 outline-none transition-colors duration-300">
                    <span class="text-xs text-slate-500 mt-2 font-sans">시간</span>
                </div>
                <span class="text-slate-500 mb-6">:</span>
                <div class="flex flex-col items-center">
                    <input id="input-m" type="number" min="0" max="59" value="05" 
                           class="w-16 sm:w-20 bg-transparent text-center border-b-2 border-slate-600 focus:border-emerald-400 outline-none transition-colors duration-300">
                    <span class="text-xs text-slate-500 mt-2 font-sans">분</span>
                </div>
                <span class="text-slate-500 mb-6">:</span>
                <div class="flex flex-col items-center">
                    <input id="input-s" type="number" min="0" max="59" value="00" 
                           class="w-16 sm:w-20 bg-transparent text-center border-b-2 border-slate-600 focus:border-emerald-400 outline-none transition-colors duration-300">
                    <span class="text-xs text-slate-500 mt-2 font-sans">초</span>
                </div>
            </div>

            <!-- 빠른 설정 버튼 -->
            <div class="flex flex-wrap justify-center gap-3">
                <button onclick="addTime(1, 0)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-full text-sm font-medium transition-colors">+ 1분</button>
                <button onclick="addTime(5, 0)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-full text-sm font-medium transition-colors">+ 5분</button>
                <button onclick="addTime(10, 0)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-full text-sm font-medium transition-colors">+ 10분</button>
                <button onclick="resetInputs()" class="px-4 py-2 bg-slate-700/50 hover:bg-slate-600 text-slate-400 rounded-full text-sm font-medium transition-colors">초기화</button>
            </div>

            <!-- 시작 버튼 -->
            <button onclick="startTimerFromSetup()" 
                    class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-900 rounded-2xl text-lg font-bold shadow-lg shadow-emerald-500/30 transition-all transform hover:scale-[1.02] active:scale-95">
                시작
            </button>
        </div>

        <!-- === [2] 타이머 실행 화면 === -->
        <div id="timer-view" class="hidden flex-col items-center justify-center">
            
            <!-- 원형 진행바 및 남은 시간 표시 -->
            <div class="relative flex items-center justify-center w-64 h-64 sm:w-72 sm:h-72 mb-8" id="ring-container">
                <!-- SVG 원형 -->
                <svg class="transform -rotate-90 w-full h-full absolute inset-0">
                    <!-- 배경 링 -->
                    <circle cx="50%" cy="50%" r="46%" stroke="currentColor" stroke-width="6%" fill="transparent" class="text-slate-700" />
                    <!-- 진행 링 -->
                    <circle id="progress-ring" cx="50%" cy="50%" r="46%" stroke="currentColor" stroke-width="6%" fill="transparent"
                            class="text-emerald-400 drop-shadow-md" 
                            stroke-linecap="round" />
                </svg>
                
                <!-- 시간 텍스트 -->
                <div id="time-display" class="absolute flex flex-col items-center justify-center font-mono text-4xl sm:text-5xl tracking-tighter">
                    00:00:00
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="flex items-center space-x-6 w-full justify-center">
                <!-- 취소 버튼 -->
                <button onclick="cancelTimer()" class="w-16 h-16 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-transform transform hover:scale-105 active:scale-95 text-slate-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- 일시정지 / 재개 버튼 -->
                <button id="toggle-btn" onclick="toggleTimer()" class="w-20 h-20 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 flex items-center justify-center transition-transform transform hover:scale-105 active:scale-95 shadow-lg shadow-emerald-500/30">
                    <!-- 일시정지 아이콘 (기본) -->
                    <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24">
                        <rect x="6" y="5" width="4" height="14" rx="1" />
                        <rect x="14" y="5" width="4" height="14" rx="1" />
                    </svg>
                    <!-- 재생 아이콘 (숨김) -->
                    <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 hidden ml-1" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M7 4v16l13-8z" />
                    </svg>
                </button>
            </div>
            
            <!-- 종료 메시지 (숨김) -->
            <div id="end-message" class="hidden absolute inset-0 bg-slate-800/90 backdrop-blur-sm flex flex-col items-center justify-center rounded-3xl z-10">
                <div class="text-rose-500 text-6xl mb-4 animate-bounce">⏰</div>
                <h2 class="text-2xl font-bold text-white mb-6">시간이 종료되었습니다!</h2>
                <button onclick="stopAlarmAndReset()" class="px-8 py-3 bg-rose-500 hover:bg-rose-400 text-white rounded-full font-bold shadow-lg transition-transform hover:scale-105 active:scale-95">
                    확인
                </button>
            </div>

        </div>
    </div>

    <script>
        // DOM 요소
        const setupView = document.getElementById('setup-view');
        const timerView = document.getElementById('timer-view');
        const inputH = document.getElementById('input-h');
        const inputM = document.getElementById('input-m');
        const inputS = document.getElementById('input-s');
        const timeDisplay = document.getElementById('time-display');
        const progressRing = document.getElementById('progress-ring');
        const toggleBtn = document.getElementById('toggle-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const playIcon = document.getElementById('play-icon');
        const ringContainer = document.getElementById('ring-container');
        const endMessage = document.getElementById('end-message');

        // 상태 변수
        let totalSeconds = 0;
        let currentSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let ringCircumference = 0;
        let audioContext = null;
        let alarmInterval = null;

        // SVG 링 둘레 계산 및 초기화
        function initRing() {
            const radius = progressRing.r.baseVal.value;
            ringCircumference = 2 * Math.PI * radius;
            progressRing.style.strokeDasharray = `${ringCircumference} ${ringCircumference}`;
            progressRing.style.strokeDashoffset = 0;
        }

        // 입력값 포맷팅 (01, 02 형태)
        function formatInput(input) {
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0;
            if (input.id !== 'input-h' && val > 59) val = 59;
            if (input.id === 'input-h' && val > 99) val = 99;
            input.value = val.toString().padStart(2, '0');
        }

        [inputH, inputM, inputS].forEach(input => {
            input.addEventListener('blur', () => formatInput(input));
            input.addEventListener('change', () => formatInput(input));
        });

        // 빠른 시간 추가 버튼
        function addTime(minutes, seconds) {
            let h = parseInt(inputH.value) || 0;
            let m = parseInt(inputM.value) || 0;
            let s = parseInt(inputS.value) || 0;

            m += minutes;
            s += seconds;

            if (s >= 60) { m += Math.floor(s / 60); s = s % 60; }
            if (m >= 60) { h += Math.floor(m / 60); m = m % 60; }
            if (h > 99) { h = 99; m = 59; s = 59; }

            inputH.value = h.toString().padStart(2, '0');
            inputM.value = m.toString().padStart(2, '0');
            inputS.value = s.toString().padStart(2, '0');
        }

        function resetInputs() {
            inputH.value = "00";
            inputM.value = "05"; // 기본 5분
            inputS.value = "00";
        }

        // 화면 전환
        function switchView(showTimer) {
            if (showTimer) {
                setupView.classList.add('hidden');
                setupView.classList.remove('flex');
                timerView.classList.remove('hidden');
                timerView.classList.add('flex');
                
                // 화면 전환 후 SVG가 렌더링된 다음 원주율 계산
                setTimeout(initRing, 10);
            } else {
                timerView.classList.add('hidden');
                timerView.classList.remove('flex');
                setupView.classList.remove('hidden');
                setupView.classList.add('flex');
                endMessage.classList.add('hidden');
                ringContainer.classList.remove('pulse-animation');
                progressRing.classList.remove('text-rose-500');
                progressRing.classList.add('text-emerald-400');
            }
        }

        // 타이머 시작 (설정 화면에서)
        function startTimerFromSetup() {
            initAudioContext(); // 오디오 권한 획득 (사용자 클릭 이벤트)
            
            const h = parseInt(inputH.value) || 0;
            const m = parseInt(inputM.value) || 0;
            const s = parseInt(inputS.value) || 0;
            
            totalSeconds = (h * 3600) + (m * 60) + s;
            
            if (totalSeconds <= 0) {
                // 시각적 피드백 (흔들림 효과)
                setupView.classList.add('animate-pulse');
                setTimeout(() => setupView.classList.remove('animate-pulse'), 300);
                return;
            }

            currentSeconds = totalSeconds;
            switchView(true);
            updateDisplay();
            setRingProgress(100);
            
            startInterval();
        }

        // 디스플레이 업데이트
        function updateDisplay() {
            const h = Math.floor(currentSeconds / 3600);
            const m = Math.floor((currentSeconds % 3600) / 60);
            const s = currentSeconds % 60;

            const formatted = [];
            if (totalSeconds >= 3600) {
                formatted.push(h.toString().padStart(2, '0'));
            }
            formatted.push(m.toString().padStart(2, '0'));
            formatted.push(s.toString().padStart(2, '0'));

            timeDisplay.textContent = formatted.join(':');

            // 색상 경고 (남은 시간에 따라)
            if (currentSeconds > 0 && currentSeconds <= 10) {
                progressRing.classList.remove('text-emerald-400');
                progressRing.classList.remove('text-amber-400');
                progressRing.classList.add('text-rose-500');
            } else if (currentSeconds > 10 && currentSeconds <= Math.min(60, totalSeconds * 0.2)) {
                progressRing.classList.remove('text-emerald-400');
                progressRing.classList.add('text-amber-400');
            } else {
                progressRing.classList.add('text-emerald-400');
                progressRing.classList.remove('text-amber-400');
                progressRing.classList.remove('text-rose-500');
            }
        }

        // SVG 링 진행도 설정 (퍼센트)
        function setRingProgress(percent) {
            const offset = ringCircumference - (percent / 100) * ringCircumference;
            progressRing.style.strokeDashoffset = offset;
        }

        // 타이머 간격 함수
        function startInterval() {
            isRunning = true;
            toggleBtn.classList.replace('bg-amber-400', 'bg-emerald-500');
            toggleBtn.classList.replace('hover:bg-amber-300', 'hover:bg-emerald-400');
            toggleBtn.classList.replace('shadow-amber-500/30', 'shadow-emerald-500/30');
            pauseIcon.classList.remove('hidden');
            playIcon.classList.add('hidden');

            timerInterval = setInterval(() => {
                currentSeconds--;
                if (currentSeconds <= 0) {
                    currentSeconds = 0;
                    updateDisplay();
                    setRingProgress(0);
                    handleTimerEnd();
                    return;
                }
                updateDisplay();
                const percent = (currentSeconds / totalSeconds) * 100;
                setRingProgress(percent);
            }, 1000);
        }

        function pauseInterval() {
            isRunning = false;
            clearInterval(timerInterval);
            
            toggleBtn.classList.replace('bg-emerald-500', 'bg-amber-400');
            toggleBtn.classList.replace('hover:bg-emerald-400', 'hover:bg-amber-300');
            toggleBtn.classList.replace('shadow-emerald-500/30', 'shadow-amber-500/30');
            pauseIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');
        }

        // 시작/일시정지 토글
        function toggleTimer() {
            if (isRunning) {
                pauseInterval();
            } else {
                startInterval();
            }
        }

        // 타이머 취소 (설정 화면으로)
        function cancelTimer() {
            pauseInterval();
            switchView(false);
        }

        // 타이머 종료 처리
        function handleTimerEnd() {
            pauseInterval();
            ringContainer.classList.add('pulse-animation');
            endMessage.classList.remove('hidden');
            endMessage.classList.add('flex');
            playAlarm();
        }

        // 알림음 및 종료화면 리셋
        function stopAlarmAndReset() {
            if (alarmInterval) clearInterval(alarmInterval);
            cancelTimer();
        }

        // --- Web Audio API를 활용한 알림음 시스템 ---
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function createBeep() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // 기분 좋은 알림음 주파수 설정
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A5 note
            oscillator.frequency.exponentialRampToValueAtTime(1760, audioContext.currentTime + 0.1); // Slide up
            
            // 볼륨 페이드아웃
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playAlarm() {
            createBeep(); // 즉시 1회 재생
            let beeps = 1;
            
            // 0.8초마다 삐- 소리 반복 (최대 10회 또는 사용자가 끌 때까지)
            alarmInterval = setInterval(() => {
                createBeep();
                beeps++;
                if (beeps >= 10) {
                    clearInterval(alarmInterval);
                }
            }, 800);
        }

        // 초기 화면 설정 보정
        window.addEventListener('resize', () => {
            if (timerView.classList.contains('flex')) {
                initRing();
                const percent = (currentSeconds / totalSeconds) * 100;
                setRingProgress(percent);
            }
        });
    </script>
</body>
</html>
